apiVersion: v1
kind: ConfigMap
metadata:
  name: ticket-triage-config
  namespace: triage-prod
  labels:
    environment: prod
    app: ticket-triage
data:
  # ── Ollama connection ──────────────────────────────────────────────────────
  OLLAMA_BASE_URL: "http://host.docker.internal:11434"

  # ── Application config ─────────────────────────────────────────────────────
  CONFIG_PATH: "/app/config.yaml"
  HOST: "0.0.0.0"
  PORT: "8000"

  # PROD: auto-reload disabled for stability.
  RELOAD: "false"

  # ── Inference ─────────────────────────────────────────────────────────────
  INFERENCE_CONCURRENCY: "1"

  # ── HuggingFace cache ─────────────────────────────────────────────────────
  HF_HOME: "/home/appuser/.cache/huggingface"
  TRANSFORMERS_CACHE: "/home/appuser/.cache/huggingface/hub"
  TOKENIZERS_PARALLELISM: "false"

  # ── Python ────────────────────────────────────────────────────────────────
  PYTHONUNBUFFERED: "1"

  # ── Environment tag ───────────────────────────────────────────────────────
  ENVIRONMENT: "prod"
