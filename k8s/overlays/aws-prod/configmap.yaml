apiVersion: v1
kind: ConfigMap
metadata:
  name: ticket-triage-config
  namespace: triage-prod
  labels:
    environment: aws-prod
    app: ticket-triage
data:
  # ── AWS Bedrock Configuration ──────────────────────────────────────────────
  # Select Amazon Bedrock provider via config-aws.yaml
  CONFIG_PATH: "/app/config-aws.yaml"
  
  # ── AWS Region ─────────────────────────────────────────────────────────────
  # Credentials sourced from EC2 IAM instance role (no static keys)
  AWS_REGION: "eu-west-1"
  AWS_DEFAULT_REGION: "eu-west-1"
  
  # ── Application Server ─────────────────────────────────────────────────────
  HOST: "0.0.0.0"
  PORT: "8000"
  ENVIRONMENT: "aws-prod"
  
  # PROD: Disable uvicorn auto-reload
  RELOAD: "false"
  
  # ── Inference ──────────────────────────────────────────────────────────────
  INFERENCE_CONCURRENCY: "1"
  
  # ── HuggingFace Model Cache ────────────────────────────────────────────────
  HF_HOME: "/home/appuser/.cache/huggingface"
  TRANSFORMERS_CACHE: "/home/appuser/.cache/huggingface/hub"
  TOKENIZERS_PARALLELISM: "false"
  
  # ── Python Runtime ─────────────────────────────────────────────────────────
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
