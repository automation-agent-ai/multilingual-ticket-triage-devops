apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# DEV overlay — triage-dev namespace
namespace: triage-dev

resources:
  - ../../base
  - namespace.yaml
  - configmap.yaml

# Additional labels for the DEV environment.
commonLabels:
  environment: dev

# Strategic merge patches applied on top of the base resources.
patches:
  - path: patches/deployment.yaml
    target:
      kind: Deployment
      name: ticket-triage

# Image tag override — use the pre-loaded local image.
images:
  - name: ticket-triage-api
    newTag: latest
