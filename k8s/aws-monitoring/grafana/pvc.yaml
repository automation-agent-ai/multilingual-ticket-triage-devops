apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: triage-monitoring
  labels:
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: grafana
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
