apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Sprint S07 — Monitoring stack (Prometheus + Grafana).
#
# IMPORTANT: The triage-monitoring namespace, prometheus-data PVC,
# grafana-data PVC, triage-prometheus ServiceAccount and triage-grafana
# ServiceAccount are ALL managed by Terraform (Sprint S06).
# They are NOT listed here. Do not recreate them with Kustomize.
#
# This Kustomization manages ONLY:
#   - Prometheus Deployment, Service, ConfigMap, and alert-rules ConfigMap
#   - Grafana Deployment, Service, datasource ConfigMap,
#     dashboard-provider ConfigMap, and dashboard JSON ConfigMap

namespace: triage-monitoring

resources:
  # Prometheus
  - prometheus/configmap.yaml
  - prometheus/alert-rules-configmap.yaml
  - prometheus/deployment.yaml
  - prometheus/service.yaml
  # Grafana
  - grafana/datasource-configmap.yaml
  - grafana/dashboard-provider-configmap.yaml
  - grafana/dashboard-configmap.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: multilingual-ticket-triage
      sprint: s07
    includeSelectors: false
