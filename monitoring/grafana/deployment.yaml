apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: triage-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: grafana
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: grafana
    spec:
      # Reuse the Terraform-managed ServiceAccount.
      serviceAccountName: triage-grafana

      securityContext:
        runAsNonRoot: true
        # Grafana official image runs as grafana user UID 472.
        runAsUser: 472
        runAsGroup: 472
        # fsGroup ensures the PVC mount is group-writable by the grafana user.
        fsGroup: 472

      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            # Admin credentials loaded from a Kubernetes Secret created
            # locally via kubectl (never committed to git).
            # Create the secret:
            #   kubectl --context docker-desktop create secret generic grafana-credentials \
            #     -n triage-monitoring \
            #     --from-literal=admin-user=admin \
            #     --from-literal=admin-password=<CHOOSE_A_PASSWORD>
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin-password
            # Disable anonymous access.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            # Paths for provisioning.
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            # Disable telemetry and update checks for this local deployment.
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: "http://localhost:13000"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false

          volumeMounts:
            # Reuse Terraform-managed PVC for Grafana data.
            - name: grafana-data
              mountPath: /var/lib/grafana
            # Provisioned datasource configuration.
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            # Dashboard provider (tells Grafana where to load dashboards from).
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            # Dashboard JSON files.
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

      volumes:
        # Terraform-managed PVC (created by Sprint S06 — do NOT redefine).
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards

      restartPolicy: Always
      terminationGracePeriodSeconds: 30
