apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: triage-monitoring
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/managed-by: kustomize
data:
  triage-alerts.yaml: |
    groups:
      - name: ticket-triage.availability
        interval: 30s
        rules:
          # Fire if the DEV scrape target disappears for 2 consecutive minutes.
          - alert: TicketTriageDevDown
            expr: up{job="ticket-triage-dev"} == 0
            for: 2m
            labels:
              severity: critical
              environment: dev
            annotations:
              summary: "Ticket Triage DEV target is unreachable"
              description: >
                Prometheus cannot scrape the ticket-triage DEV service
                (ticket-triage.triage-dev.svc.cluster.local:8000) and has not
                been able to for more than 2 minutes.

      - name: ticket-triage.errors
        interval: 30s
        rules:
          # Fire if more than 10% of all requests return 5xx for 2 minutes.
          - alert: TicketTriageHighErrorRate
            expr: |
              (
                rate(http_requests_total{job="ticket-triage-dev",status_code=~"5.."}[5m])
                /
                rate(http_requests_total{job="ticket-triage-dev"}[5m])
              ) > 0.1
            for: 2m
            labels:
              severity: warning
              environment: dev
            annotations:
              summary: "High 5xx error rate on Ticket Triage DEV"
              description: >
                More than 10% of HTTP requests to ticket-triage DEV are
                returning 5xx status codes over a 5-minute window.

          # Fire if the triage failure counter is increasing.
          - alert: TicketTriageFailuresDetected
            expr: rate(triage_failures_total{job="ticket-triage-dev"}[5m]) > 0
            for: 2m
            labels:
              severity: warning
              environment: dev
            annotations:
              summary: "Triage failures detected on DEV"
              description: >
                The triage_failures_total counter is incrementing, indicating
                that /triage requests are returning 5xx errors.
