apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: triage-monitoring
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/managed-by: kustomize
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      external_labels:
        cluster: 'docker-desktop'

    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Ticket Triage DEV — instrumented with Sprint S07 metrics endpoint
      - job_name: 'ticket-triage-dev'
        metrics_path: /metrics
        scrape_interval: 30s
        static_configs:
          - targets: ['ticket-triage.triage-dev.svc.cluster.local:8000']
        relabel_configs:
          - target_label: environment
            replacement: dev
          - target_label: app
            replacement: ticket-triage

      # Ticket Triage PROD — /metrics not yet available (image not updated).
      # Commented out to avoid showing spurious "down" alerts until PROD is
      # updated with the s07-metrics image in a follow-up sprint.
      # Uncomment and re-apply when PROD image is updated:
      # - job_name: 'ticket-triage-prod'
      #   metrics_path: /metrics
      #   static_configs:
      #     - targets: ['ticket-triage.triage-prod.svc.cluster.local:8000']
      #   relabel_configs:
      #     - target_label: environment
      #       replacement: prod
      #     - target_label: app
      #       replacement: ticket-triage
