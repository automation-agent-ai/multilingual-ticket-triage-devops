# ──────────────────────────────────────────────────────────────────────────────
# Deploy — PROD
#
# Promotes a GHCR image to the triage-prod Kubernetes namespace.
# Manual trigger only — production deployments are never automated.
#
# Approval gate:
#   This workflow uses GitHub Environment "production". Before any job in this
#   environment runs, GitHub pauses and waits for a required reviewer to
#   approve in the GitHub UI (Settings → Environments → production →
#   Required reviewers).  Configure at least one reviewer before use.
#
#   The workflow also requires an explicit "DEPLOY" confirmation in the input
#   form to prevent accidental triggering.
#
# ⚠️  CONNECTIVITY LIMITATION — READ BEFORE ENABLING
# ────────────────────────────────────────────────────
# Same constraint as deploy-dev.yml: GitHub-hosted runners cannot reach
# the local Docker Desktop kind cluster.  The kubectl apply step is disabled.
# See deploy-dev.yml and docs/CICD.md §5 for options.
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy — PROD

# Manual trigger only — no automatic deployments to production.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR SHA tag to promote to PROD (sha-<40-char-sha>)"
        required: true
      confirm_production:
        description: "Type DEPLOY to confirm production deployment"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Gate 1 — Input validation (runs immediately; no approval needed yet)
  # ────────────────────────────────────────────────────────────────────────────
  validate-inputs:
    name: Validate PROD inputs
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation word
        run: |
          if [ "${{ inputs.confirm_production }}" != "DEPLOY" ]; then
            echo "::error::Production deployment requires exactly 'DEPLOY' in the confirmation field."
            exit 1
          fi
          echo "Confirmation word accepted."

      - name: Verify image tag format
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::image_tag must not be empty."
            exit 1
          fi
          # Warn if the tag looks like 'latest' — SHA tags are preferred for PROD.
          if [ "$TAG" = "latest" ]; then
            echo "::warning::Deploying 'latest' to PROD is not recommended; prefer a sha-<sha> tag."
          fi
          echo "Image tag: $TAG"

  # ────────────────────────────────────────────────────────────────────────────
  # Gate 2 — PROD deploy (pauses here until a required reviewer approves)
  #
  # Configure required reviewers in:
  #   GitHub → Settings → Environments → production → Required reviewers
  # ────────────────────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy to triage-prod
    runs-on: ubuntu-latest
    needs: validate-inputs

    # ← Approval gate: workflow pauses here until a reviewer approves in GitHub.
    environment: production

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: automation-agent-ai/multilingual-ticket-triage-devops
      NAMESPACE: triage-prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve full image reference
        id: image
        run: |
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Promoting to PROD: $REF"

      # ── Install CLI tools ─────────────────────────────────────────────────
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.32.0"

      # kustomize standalone is required for `kustomize edit set image`.
      - name: Set up kustomize
        run: |
          KUSTOMIZE_VERSION="v5.4.3"
          curl -sL \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin/
          kustomize version

      # ── Patch kustomization (workspace only — NOT committed) ──────────────
      - name: Set registry image reference in kustomization
        run: |
          cd k8s/ci-overlays/prod
          kustomize edit set image \
            "ticket-triage-api=${{ steps.image.outputs.ref }}"
          echo "Updated k8s/ci-overlays/prod/kustomization.yaml:"
          grep -A4 "^images:" kustomization.yaml

      # ── Render and validate manifests ─────────────────────────────────────
      - name: Render CI manifests (dry-run validation)
        run: |
          echo "========================================================"
          echo " Final manifests — triage-prod (CI registry deployment)  "
          echo "========================================================"
          kubectl kustomize k8s/ci-overlays/prod

      # ── ACTUAL DEPLOYMENT — DISABLED ─────────────────────────────────────
      # Uncomment when KUBECONFIG_PROD secret is configured.
      #
      # - name: Apply to PROD cluster
      #   env:
      #     KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_PROD }}
      #   run: |
      #     echo "$KUBECONFIG_DATA" > /tmp/kubeconfig
      #     chmod 600 /tmp/kubeconfig
      #     export KUBECONFIG=/tmp/kubeconfig
      #     kubectl apply -k k8s/ci-overlays/prod
      #     kubectl rollout status deployment/ticket-triage \
      #       -n "${{ env.NAMESPACE }}" --timeout=300s
      #     rm -f /tmp/kubeconfig
      # ─────────────────────────────────────────────────────────────────────

      # ── Job summary ───────────────────────────────────────────────────────
      - name: Write job summary
        run: |
          {
            echo "### PROD Deployment — Approved & Dry Run"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.image.outputs.ref }}\` |"
            echo "| Namespace | \`${{ env.NAMESPACE }}\` |"
            echo "| Kustomize overlay | \`k8s/ci-overlays/prod\` |"
            echo "| Approved by | \`${{ github.actor }}\` |"
            echo "| Applied to cluster | ❌ Disabled — GitHub-hosted runner has no route to local cluster |"
            echo ""
            echo "**To deploy manually on your workstation:**"
            echo "\`\`\`bash"
            echo "# 1. Pull image from GHCR"
            echo "docker pull ${{ steps.image.outputs.ref }}"
            echo ""
            echo "# 2. Stage into kind node"
            echo "KIND_NODE=\$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')"
            echo "docker save ${{ steps.image.outputs.ref }} \\"
            echo "  | docker exec -i \"\$KIND_NODE\" ctr -n k8s.io images import -"
            echo ""
            echo "# 3. Apply manifests"
            echo "cd k8s/overlays/prod"
            echo "kustomize edit set image \\"
            echo "  'ticket-triage-api=${{ steps.image.outputs.ref }}'"
            echo "kubectl apply -k ."
            echo "kubectl rollout status deployment/ticket-triage \\"
            echo "  -n ${{ env.NAMESPACE }} --timeout=300s"
            echo ""
            echo "# 4. Smoke test"
            echo "kubectl port-forward svc/ticket-triage 8080:8000 -n ${{ env.NAMESPACE }} &"
            echo "curl -s http://localhost:8080/health"
            echo "curl -s -X POST http://localhost:8080/triage \\"
            echo "  -H 'Content-Type: application/json' \\"
            echo "  -d '{\"ticket_id\":\"smoke-01\",\"subject\":\"Test\",\"body\":\"PROD smoke test\"}'"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
