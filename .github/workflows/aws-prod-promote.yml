# ──────────────────────────────────────────────────────────────────────────────
# AWS PROD Promotion — Manual PROD Deployment Only
#
# PURPOSE:
#   Lightweight workflow for manual PROD promotion from validated DEV images.
#   Lives on main branch to enable workflow_dispatch UI.
#
# TRIGGERS:
#   workflow_dispatch only (manual GitHub Actions UI or API)
#
# ARCHITECTURE:
#   Minimal workflow for PROD deployment only.
#   DEV deployment handled by aws-ci-cd.yml on feature branches.
#
# SECURITY:
#   • GitHub Environment: aws-prod (requires approval)
#   • Must type "PROMOTE" to confirm
#   • Immutable image from DEV (SHA256 digest)
#   • Automatic rollback on failure
#   • Fail-safe environment protection check
# ──────────────────────────────────────────────────────────────────────────────

name: AWS PROD Promotion

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag from DEV (aws-sha-<commit>)"
        required: true
      confirm_production:
        description: 'Type "PROMOTE" to confirm PROD deployment'
        required: true

permissions:
  contents: read
  id-token: write
  packages: read

env:
  AWS_REGION: eu-west-1
  EC2_INSTANCE_ID: i-07bc3aaf0d692974d
  REGISTRY: ghcr.io
  IMAGE_NAME: automation-agent-ai/multilingual-ticket-triage-devops

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Validate PROD Promotion Request
  # ────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate PROD Promotion
    runs-on: ubuntu-latest
    
    steps:
      - name: Verify PROMOTE confirmation
        run: |
          if [ "${{ inputs.confirm_production }}" != "PROMOTE" ]; then
            echo "::error::PROD deployment requires exact string: PROMOTE"
            echo "You entered: '${{ inputs.confirm_production }}'"
            exit 1
          fi
          echo "✅ PROD confirmation verified"

      - name: Verify image tag format
        run: |
          TAG="${{ inputs.image_tag }}"
          if [[ ! "$TAG" =~ ^aws-sha-[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid image tag format: $TAG"
            echo "Expected: aws-sha-<40-char-hex-commit>"
            exit 1
          fi
          echo "✅ Image tag validated: $TAG"

      - name: Verify aws-prod environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REVIEWERS=$(gh api repos/${{ github.repository }}/environments/aws-prod \
            --jq '.protection_rules[] | select(.type=="required_reviewers") | .reviewers | length' \
            2>/dev/null || echo "0")
          
          if [ "$REVIEWERS" -lt 1 ]; then
            echo "::error::aws-prod environment has no required reviewers"
            echo "PROD deployment BLOCKED for safety"
            echo "Configure at: https://github.com/${{ github.repository }}/settings/environments"
            exit 1
          fi
          
          echo "✅ aws-prod has $REVIEWERS required reviewer(s)"

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Deploy to AWS PROD
  # ────────────────────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy to AWS triage-prod
    runs-on: ubuntu-latest
    needs: validate
    environment: aws-prod  # ← APPROVAL GATE (requires reviewer)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::523231704152:role/github-actions-aws-deployer
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-aws-prod-${{ github.run_id }}

      - name: Verify SSM connectivity
        run: |
          PING=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${{ env.EC2_INSTANCE_ID }}" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)
          
          if [ "$PING" != "Online" ]; then
            echo "::error::EC2 instance not online in SSM: $PING"
            exit 1
          fi
          echo "✅ SSM connectivity verified"

      - name: Resolve image digest
        id: digest
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}"
          
          echo "Pulling manifest for: $IMAGE_REF"
          DIGEST=$(docker manifest inspect "$IMAGE_REF" | jq -r '.config.digest')
          
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "::error::Failed to resolve digest for image: $IMAGE_REF"
            exit 1
          fi
          
          IMMUTABLE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "ref=${IMMUTABLE_REF}" >> "$GITHUB_OUTPUT"
          
          {
            echo "### 🎯 Deployment Image"
            echo "- **Tag:** \`${{ inputs.image_tag }}\`"
            echo "- **Digest:** \`${DIGEST}\`"
            echo "- **Immutable Ref:** \`${IMMUTABLE_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create deployment manifest
        run: |
          mkdir -p /tmp/deploy
          
          cat > /tmp/deploy/deploy-prod.sh <<'DEPLOY_SCRIPT'
          #!/bin/bash
          set -euo pipefail
          
          NAMESPACE="triage-prod"
          IMAGE_REF="${{ steps.digest.outputs.ref }}"
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "PROD Deployment Started"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          cd /home/ubuntu/workspaces/multilingual-ticket-triage-devops
          
          # Verify k3s cluster is healthy
          if ! kubectl cluster-info &>/dev/null; then
            echo "::error::k3s cluster not responding"
            exit 1
          fi
          
          # Verify namespace exists
          if ! kubectl get namespace "$NAMESPACE" &>/dev/null; then
            echo "::error::Namespace $NAMESPACE does not exist"
            exit 1
          fi
          
          # Record current state for rollback
          ROLLBACK_IMAGE=$(kubectl get deployment -n "$NAMESPACE" multilingual-ticket-triage \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "none")
          
          echo "Previous image: $ROLLBACK_IMAGE"
          echo "New image: $IMAGE_REF"
          
          # Deploy with Kustomize
          cd k8s/overlays/aws-prod
          kustomize edit set image \
            "ghcr.io/automation-agent-ai/multilingual-ticket-triage-devops=$IMAGE_REF"
          
          kubectl apply -k . --namespace="$NAMESPACE"
          
          # Wait for rollout
          echo "Waiting for rollout to complete..."
          if ! kubectl rollout status deployment/multilingual-ticket-triage \
            -n "$NAMESPACE" --timeout=5m; then
            echo "::error::Rollout failed, initiating rollback"
            
            if [ "$ROLLBACK_IMAGE" != "none" ]; then
              kustomize edit set image \
                "ghcr.io/automation-agent-ai/multilingual-ticket-triage-devops=$ROLLBACK_IMAGE"
              kubectl apply -k . --namespace="$NAMESPACE"
              kubectl rollout status deployment/multilingual-ticket-triage \
                -n "$NAMESPACE" --timeout=3m
              echo "✅ Rollback complete"
            fi
            exit 1
          fi
          
          echo "✅ PROD deployment complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          DEPLOY_SCRIPT
          
          chmod +x /tmp/deploy/deploy-prod.sh

      - name: Execute deployment via SSM
        id: deploy
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions PROD deployment - Run ${{ github.run_id }}" \
            --parameters commands="$(cat /tmp/deploy/deploy-prod.sh)" \
            --output text \
            --query 'Command.CommandId')
          
          echo "command-id=${CMD_ID}" >> "$GITHUB_OUTPUT"
          echo "Waiting for deployment to complete..."
          
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --timeout 300 \
            || true
          
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query 'Status' \
            --output text)
          
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query 'StandardErrorContent' \
              --output text
            exit 1
          fi
          
          echo "✅ PROD deployment complete"

      - name: Verify deployment health
        run: |
          # Basic health check via SSM
          HEALTH_CHECK='
          kubectl get pods -n triage-prod -l app=multilingual-ticket-triage
          kubectl get deployment -n triage-prod multilingual-ticket-triage -o json | \
            jq -r ".status | \"Ready: \(.readyReplicas // 0)/\(.replicas // 0)\""
          '
          
          OUTPUT=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=${HEALTH_CHECK}" \
            --query 'Command.CommandId' \
            --output text)
          
          aws ssm wait command-executed \
            --command-id "$OUTPUT" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --timeout 60 \
            || true
          
          aws ssm get-command-invocation \
            --command-id "$OUTPUT" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query 'StandardOutputContent' \
            --output text
          
          {
            echo "### ✅ PROD Deployment Complete"
            echo "- **Environment:** triage-prod"
            echo "- **Image:** \`${{ inputs.image_tag }}\`"
            echo "- **Digest:** \`${{ steps.digest.outputs.digest }}\`"
            echo "- **Deployment:** Successful"
          } >> "$GITHUB_STEP_SUMMARY"
