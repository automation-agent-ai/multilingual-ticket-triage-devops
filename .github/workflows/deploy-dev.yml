# ──────────────────────────────────────────────────────────────────────────────
# Deploy — DEV
#
# Deploys a GHCR image to the triage-dev Kubernetes namespace.
# Triggered automatically when the CI workflow completes successfully on main,
# or manually via workflow_dispatch with an explicit image tag.
#
# ⚠️  CONNECTIVITY LIMITATION — READ BEFORE ENABLING
# ────────────────────────────────────────────────────
# GitHub-hosted runners (ubuntu-latest) execute on Azure infrastructure.
# They have no network route to the local Docker Desktop kind cluster
# running on the developer workstation.
#
# This workflow is therefore designed as a VALIDATED DRY-RUN:
#   • Image reference and kustomization edits are applied in the workflow
#     workspace (never committed).
#   • `kubectl kustomize` renders and validates the final manifests.
#   • The actual `kubectl apply` step is disabled (if: false).
#
# To enable live deployment, choose one of:
#   Option A — Self-hosted runner:
#     Register a runner inside the cluster network.
#     Set runs-on to the runner label.  Uncomment the apply step.
#   Option B — Remote cluster (Hetzner k3s, recommended for production):
#     Add KUBECONFIG_DEV secret (scoped kubeconfig for triage-dev namespace).
#     Uncomment the apply step.  Evaluate Option B alongside security review.
#
# See docs/CICD.md §5 for deployment options analysis.
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy — DEV

on:
  # Automatic: run after CI completes successfully on main.
  workflow_run:
    workflows: ["CI — Test · Build · Scan · Publish"]
    types: [completed]
    branches: [main]

  # Manual: trigger with an explicit GHCR tag for re-deploys or rollbacks.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag (e.g. sha-abc123…40chars or latest)"
        required: true
        default: "latest"

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Deploy to triage-dev
    runs-on: ubuntu-latest

    # Only proceed when triggered by a successful CI run.
    # workflow_dispatch bypasses this condition (manual invocations are explicit).
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'

    # GitHub Environment "dev" — optionally add required-reviewers or
    # deployment wait timers in: Settings → Environments → dev.
    environment: dev

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: automation-agent-ai/multilingual-ticket-triage-devops
      NAMESPACE: triage-dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Resolve image tag ─────────────────────────────────────────────────
      # workflow_run events carry the SHA of the triggering commit.
      # workflow_dispatch inputs carry an explicit tag supplied by the operator.
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="sha-${{ github.event.workflow_run.head_sha }}"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Resolve full image reference
        id: image
        run: |
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Image: $REF"

      # ── Install CLI tools ─────────────────────────────────────────────────
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.32.0"

      # kustomize standalone is required for `kustomize edit set image`.
      # kubectl bundles `kubectl kustomize` (build only) but not `edit`.
      - name: Set up kustomize
        run: |
          KUSTOMIZE_VERSION="v5.4.3"
          curl -sL \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin/
          kustomize version

      # ── Patch kustomization (workspace only — NOT committed) ──────────────
      # Sets both newName (GHCR registry path) and newTag (immutable SHA).
      # Equivalent to hand-editing the images: block in kustomization.yaml.
      - name: Set registry image reference in kustomization
        run: |
          cd k8s/ci-overlays/dev
          kustomize edit set image \
            "ticket-triage-api=${{ steps.image.outputs.ref }}"
          echo "Updated k8s/ci-overlays/dev/kustomization.yaml:"
          grep -A4 "^images:" kustomization.yaml

      # ── Render and validate manifests ─────────────────────────────────────
      # Uses the CI overlay which extends the dev overlay and changes
      # imagePullPolicy from Never (local kind) to IfNotPresent (registry pull).
      - name: Render CI manifests (dry-run validation)
        run: |
          echo "========================================================"
          echo "  Final manifests — triage-dev (CI registry deployment)  "
          echo "========================================================"
          kubectl kustomize k8s/ci-overlays/dev

      # ── ACTUAL DEPLOYMENT — DISABLED ─────────────────────────────────────
      # Uncomment when a kubeconfig secret or self-hosted runner is available.
      #
      # - name: Apply to DEV cluster
      #   env:
      #     KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DEV }}
      #   run: |
      #     echo "$KUBECONFIG_DATA" > /tmp/kubeconfig
      #     chmod 600 /tmp/kubeconfig
      #     export KUBECONFIG=/tmp/kubeconfig
      #     kubectl apply -k k8s/ci-overlays/dev
      #     kubectl rollout status deployment/ticket-triage \
      #       -n "${{ env.NAMESPACE }}" --timeout=300s
      #     rm -f /tmp/kubeconfig
      # ─────────────────────────────────────────────────────────────────────

      # ── Job summary ───────────────────────────────────────────────────────
      - name: Write job summary
        run: |
          {
            echo "### DEV Deployment — Dry Run"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.image.outputs.ref }}\` |"
            echo "| Namespace | \`${{ env.NAMESPACE }}\` |"
            echo "| Kustomize overlay | \`k8s/ci-overlays/dev\` |"
            echo "| Applied to cluster | ❌ Disabled — GitHub-hosted runner has no route to local cluster |"
            echo ""
            echo "**To deploy manually on your workstation:**"
            echo "\`\`\`bash"
            echo "# 1. Pull image from GHCR"
            echo "docker pull ${{ steps.image.outputs.ref }}"
            echo ""
            echo "# 2. Stage into kind node (find node name with: kubectl get nodes)"
            echo "KIND_NODE=\$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')"
            echo "docker save ${{ steps.image.outputs.ref }} \\"
            echo "  | docker exec -i \"\$KIND_NODE\" ctr -n k8s.io images import -"
            echo ""
            echo "# 3. Apply manifests"
            echo "cd k8s/overlays/dev"
            echo "kustomize edit set image \\"
            echo "  'ticket-triage-api=${{ steps.image.outputs.ref }}'"
            echo "kubectl apply -k ."
            echo "kubectl rollout status deployment/ticket-triage \\"
            echo "  -n ${{ env.NAMESPACE }} --timeout=300s"
            echo ""
            echo "# 4. Smoke test"
            echo "kubectl port-forward svc/ticket-triage 8080:8000 -n ${{ env.NAMESPACE }} &"
            echo "curl -s http://localhost:8080/health"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
