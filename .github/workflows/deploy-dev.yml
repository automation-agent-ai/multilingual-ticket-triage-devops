# ──────────────────────────────────────────────────────────────────────────────
# Deploy — DEV  [RETIRED — Sprint G12.1, 2026-10-26]
#
# ⚠️  THIS WORKFLOW IS RETIRED AND WILL NOT EXECUTE DEPLOYMENTS.
#
# The WSL/kind infrastructure this workflow targeted has been superseded by the
# AWS k3s cluster.  The active DEV deployment path is aws-ci-cd.yml.
#
# Retirement changes (Sprint G12.1):
#   • workflow_run trigger REMOVED — prevents queue accumulation against the
#     offline self-hosted runner (liora-dev-deployer-wsl2, label: triage-dev-deployer).
#   • workflow_dispatch retained as a HISTORICAL REFERENCE ONLY.
#     Any manual trigger will queue indefinitely — the runner is offline.
#     The job-level `if: false` guard ensures even a queued run never executes.
#
# Infrastructure that was required (no longer provisioned):
#   • Self-hosted runner: liora-dev-deployer-wsl2 (label: triage-dev-deployer)
#   • Kind cluster at 127.0.0.1 accessible from the runner
#   • KUBECONFIG_DEV GitHub Environment secret (scoped to triage-dev namespace)
#   • GitHub Environment: dev
#
# DO NOT re-enable this workflow or register a new runner for it.
# Active DEV deployment: .github/workflows/aws-ci-cd.yml → job deploy-dev
# Active PROD promotion: .github/workflows/aws-prod-promote.yml
#
# Historical deployment evidence is preserved; see GitHub Actions run history.
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy — DEV [RETIRED]

on:
  # NOTE: workflow_run trigger intentionally removed (Sprint G12.1).
  # Removing it stops this workflow from queuing after every CI run on main
  # against the offline runner liora-dev-deployer-wsl2.
  #
  # Original trigger (preserved for documentation):
  #   workflow_run:
  #     workflows: ["CI — Test · Build · Scan · Publish"]
  #     types: [completed]
  #     branches: [main]

  # Historical reference only — any trigger queues forever (runner offline).
  workflow_dispatch:
    inputs:
      image_tag:
        description: >
          [RETIRED] GHCR image tag — this workflow no longer deploys.
          Use aws-ci-cd.yml for AWS DEV deployments.
          Format: sha-<40-hex-chars>  (immutable, preferred)
          or: latest  (mutable, use with caution)
        required: true
        default: "latest"

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Deploy to triage-dev [RETIRED — will not run]
    # ── Self-hosted runner requirement ─────────────────────────────────────
    # Runner liora-dev-deployer-wsl2 (label: triage-dev-deployer) is OFFLINE.
    # This job targets the WSL/kind cluster — no longer the active deployment path.
    runs-on: [self-hosted, linux, triage-dev-deployer]

    # ── RETIREMENT GUARD ──────────────────────────────────────────────────
    # if: false prevents execution regardless of trigger.
    # The workflow is retained as historical documentation only.
    # Active DEV deployment: aws-ci-cd.yml → deploy-dev job (AWS k3s via SSM).
    if: false

    # GitHub Environment "dev" — add required-reviewers for an extra gate.
    environment: dev

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: automation-agent-ai/multilingual-ticket-triage-devops
      NAMESPACE: triage-dev
      # Deterministic kubeconfig path — derived from run context so it is known
      # at template-evaluation time and accessible by ALL steps without relying
      # on step outputs.  Using a fixed path (not mktemp) eliminates the attack
      # surface where steps.kubeconfig.outputs.path evaluates to "" (empty) when
      # the write step fails, which would cause kubectl to fall back to the host
      # ~/.kube/config (docker-desktop cluster-admin) and bypass scoped RBAC.
      KUBECONFIG: /tmp/kubeconfig-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      # ── Resolve image tag ───────────────────────────────────────────────
      # workflow_run events carry the SHA of the triggering commit.
      # workflow_dispatch inputs carry an explicit tag from the operator.
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="sha-${{ github.event.workflow_run.head_sha }}"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      # ── Validate image tag format ────────────────────────────────────────
      # Enforce sha-<40-hex> for immutable deployments.
      # 'latest' is permitted via workflow_dispatch with a warning.
      - name: Validate image tag
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          if [[ "$TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "✅ Immutable SHA tag confirmed: $TAG"
          elif [ "$TAG" = "latest" ]; then
            echo "::warning::Deploying 'latest' tag — not immutable. Prefer sha-<sha> for traceability."
          else
            echo "::error::Unrecognised tag format: '$TAG'. Use sha-<40-hex-chars> or latest."
            exit 1
          fi

      - name: Resolve full image reference
        id: image
        run: |
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Image: $REF"

      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── kustomize ───────────────────────────────────────────────────────
      # kustomize standalone needed for `kustomize edit set image`.
      # kubectl bundles `kubectl kustomize` (build only) but not `edit`.
      - name: Set up kustomize
        run: |
          if command -v kustomize &>/dev/null; then
            echo "kustomize already available: $(kustomize version)"
          else
            KUSTOMIZE_VERSION="v5.4.3"
            # Install to user-writable directory (runner runs as non-root niwr user)
            mkdir -p "$HOME/.local/bin"
            curl -sL \
              "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
              | tar -xz -C "$HOME/.local/bin/"
            export PATH="$HOME/.local/bin:$PATH"
            kustomize version
          fi
          # Ensure ~/.local/bin is on PATH for all subsequent steps
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ── Patch kustomization (workspace only — NOT committed) ─────────────
      - name: Set registry image reference in kustomization
        run: |
          cd k8s/ci-overlays/dev
          kustomize edit set image \
            "ticket-triage-api=${{ steps.image.outputs.ref }}"
          echo "Updated k8s/ci-overlays/dev/kustomization.yaml:"
          grep -A4 "^images:" kustomization.yaml

      # ── Render manifests (validation) ────────────────────────────────────
      - name: Render CI manifests
        run: |
          echo "========================================================"
          echo "  Final manifests — triage-dev (CI registry deployment)  "
          echo "========================================================"
          kubectl kustomize k8s/ci-overlays/dev

      # ── Write scoped kubeconfig ──────────────────────────────────────────
      # KUBECONFIG_DEV is stored as a GitHub Environment secret.
      # Content: scoped kubeconfig for cicd-deployer ServiceAccount (triage-dev).
      #
      # Security design:
      #   • Target path is the job-level KUBECONFIG env var (fixed, deterministic).
      #     All cluster steps inherit it automatically — no step output involved.
      #     This eliminates the race where steps.kubeconfig.outputs.path evaluates
      #     to "" on step failure and kubectl falls back to ~/.kube/config
      #     (docker-desktop cluster-admin), bypassing the scoped cicd-deployer RBAC.
      #   • File is chmod 600 (owner-only read/write).
      #   • Verified non-empty before succeeding (catches missing/empty secret).
      #   • Deleted in the always() cleanup step below.
      - name: Write scoped kubeconfig
        id: kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DEV }}
        run: |
          # KUBECONFIG path is set by the job-level env block (fixed, deterministic).
          echo "$KUBECONFIG_DATA" > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          # Abort early if the secret was empty or missing — do not proceed with
          # an empty KUBECONFIG file that would cause kubectl to fall back to
          # the host admin config.
          if [ ! -s "$KUBECONFIG" ]; then
            echo "::error::KUBECONFIG_DEV secret is empty or missing. Aborting."
            rm -f "$KUBECONFIG"
            exit 1
          fi
          echo "Scoped kubeconfig written to: $KUBECONFIG (permissions 600)"

      # ── Apply to DEV cluster ─────────────────────────────────────────────
      # The ci-overlay includes a Namespace resource (already exists in cluster).
      # The cicd-deployer SA cannot GET cluster-scoped Namespace resources
      # (by design — no cluster-level permissions).  We render the manifests
      # and strip Namespace docs before applying (the namespace already exists).
      - name: Apply to triage-dev cluster
        id: apply
        run: |
          # Guard: abort loudly if the scoped kubeconfig file is absent.
          # An empty KUBECONFIG would cause kubectl to fall back to the host
          # ~/.kube/config (cluster-admin), bypassing cicd-deployer RBAC.
          if [ ! -f "${KUBECONFIG}" ]; then
            echo "::error::Scoped kubeconfig not found at '${KUBECONFIG}'. Aborting to prevent admin credential fallback."
            exit 1
          fi
          # Render manifests and strip the Namespace document.
          # The cicd-deployer SA has no GET on cluster-scoped Namespace resources.
          # The triage-dev namespace already exists; no need to manage it via CD.
          # Python one-liner keeps the YAML literal block valid (no unindented lines).
          kubectl kustomize k8s/ci-overlays/dev \
            | python3 -c "import sys,re; docs=sys.stdin.read().split('\n---\n'); filtered=[d for d in docs if not re.search(r'^kind:\s*Namespace',d,re.M)]; print('\n---\n'.join(filtered))" \
            > /tmp/deploy-dev-manifests.yaml

          echo "Applying to namespace: ${{ env.NAMESPACE }}"
          kubectl apply -f /tmp/deploy-dev-manifests.yaml
          rm -f /tmp/deploy-dev-manifests.yaml

      # ── Rollout verification ─────────────────────────────────────────────
      - name: Wait for rollout to complete
        id: rollout
        run: |
          if [ ! -f "${KUBECONFIG}" ]; then
            echo "::error::Scoped kubeconfig not found at '${KUBECONFIG}'. Aborting."
            exit 1
          fi
          echo "Waiting for deployment/ticket-triage rollout (timeout: 300s)"
          kubectl rollout status deployment/ticket-triage \
            --namespace "${{ env.NAMESPACE }}" \
            --timeout=300s

      # ── Smoke test — health endpoints ────────────────────────────────────
      - name: Verify readiness via kubectl exec probe
        run: |
          if [ ! -f "${KUBECONFIG}" ]; then
            echo "::error::Scoped kubeconfig not found at '${KUBECONFIG}'. Aborting."
            exit 1
          fi
          POD=$(kubectl get pod \
            -n "${{ env.NAMESPACE }}" \
            -l app=ticket-triage \
            -o jsonpath='{.items[0].metadata.name}')
          echo "Target pod: $POD"

          echo "--- GET /health ---"
          kubectl exec "$POD" -n "${{ env.NAMESPACE }}" \
            -- curl -sf http://localhost:8000/health

          echo "--- GET /ready ---"
          kubectl exec "$POD" -n "${{ env.NAMESPACE }}" \
            -- curl -sf http://localhost:8000/ready

          echo "--- GET /metrics (first 10 lines) ---"
          kubectl exec "$POD" -n "${{ env.NAMESPACE }}" \
            -- curl -sf http://localhost:8000/metrics | head -10

      # ── Verify image provenance ──────────────────────────────────────────
      - name: Confirm image reference on running pod
        run: |
          if [ ! -f "${KUBECONFIG}" ]; then
            echo "::error::Scoped kubeconfig not found at '${KUBECONFIG}'. Aborting."
            exit 1
          fi
          ACTUAL=$(kubectl get pod \
            -n "${{ env.NAMESPACE }}" \
            -l app=ticket-triage \
            -o jsonpath='{.items[0].spec.containers[0].image}')
          EXPECTED="${{ steps.image.outputs.ref }}"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Image mismatch — pod is running a different image than deployed."
            exit 1
          fi
          echo "✅ Image provenance confirmed."

      # ── Rollback on failure ──────────────────────────────────────────────
      # Runs only if the apply succeeded but the rollout itself failed.
      # Does NOT run for smoke-test step failures (exec/verify errors
      # are post-deployment checks, not deployment failures).
      - name: Rollback on failure
        # kubeconfig.outcome == 'success' is required: without it this step could
        # run under the failure() condition even when the kubeconfig was never
        # written, causing kubectl to fall back to the host ~/.kube/config
        # (cluster-admin) for the rollback — a security bypass.
        if: >-
          failure()
          && steps.kubeconfig.outcome == 'success'
          && steps.apply.outcome == 'success'
          && steps.rollout.outcome == 'failure'
        run: |
          if [ ! -f "${KUBECONFIG}" ]; then
            echo "::error::Scoped kubeconfig not found at '${KUBECONFIG}'. Aborting rollback to prevent admin credential fallback."
            exit 1
          fi
          echo "::warning::Rollout failed — rolling back deployment/ticket-triage"
          kubectl rollout undo deployment/ticket-triage \
            --namespace "${{ env.NAMESPACE }}"
          kubectl rollout status deployment/ticket-triage \
            --namespace "${{ env.NAMESPACE }}" \
            --timeout=120s
          echo "Rollback complete."

      # ── Kubeconfig cleanup (always) ──────────────────────────────────────
      # Uses the job-level KUBECONFIG env var (fixed path), NOT step outputs.
      # steps.kubeconfig.outputs.path evaluates to "" if the write step failed,
      # making [ -f "" ] a silent no-op that leaks the file.  The fixed path
      # is always known regardless of step outcome.
      - name: Delete scoped kubeconfig
        if: always()
        run: |
          if [ -f "${KUBECONFIG}" ]; then
            rm -f "${KUBECONFIG}"
            echo "Kubeconfig deleted: ${KUBECONFIG}"
          else
            echo "Kubeconfig not present at '${KUBECONFIG}' — nothing to delete."
          fi

      # ── Job summary ──────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          RESULT="✅ Deployed"
          if [ "${{ steps.rollout.outcome }}" != "success" ]; then
            RESULT="❌ Failed (see rollback)"
          fi
          {
            echo "### DEV Deployment — ${RESULT}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.image.outputs.ref }}\` |"
            echo "| Namespace | \`${{ env.NAMESPACE }}\` |"
            echo "| Kustomize overlay | \`k8s/ci-overlays/dev\` |"
            echo "| Runner | \`${{ runner.name }}\` |"
            echo "| Triggered by | \`${{ github.actor }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Apply outcome | ${{ steps.apply.outcome }} |"
            echo "| Rollout outcome | ${{ steps.rollout.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
