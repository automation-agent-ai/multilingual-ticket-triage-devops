# ──────────────────────────────────────────────────────────────────────────────
# Deploy — DEV
#
# Deploys a GHCR image to the triage-dev Kubernetes namespace.
#
# Triggers:
#   • workflow_dispatch — explicit manual trigger (preferred; operator chooses tag)
#   • workflow_run      — automatic after CI completes successfully on main
#                         (runs only on the self-hosted runner; no fork exposure)
#
# Runner:
#   Requires a self-hosted runner labeled  triage-dev-deployer  co-located with
#   the kind cluster.  GitHub-hosted runners (ubuntu-latest) cannot reach the
#   local cluster at 127.0.0.1.
#
#   Setup:
#     1. kubectl apply -k k8s/runner/          # create RBAC identity
#     2. bash scripts/generate-runner-kubeconfig.sh  # produce KUBECONFIG_DEV
#     3. Upload KUBECONFIG_DEV to GitHub: Settings → Environments → dev → Secrets
#     4. APPROVED=yes GH_RUNNER_TOKEN=<token> bash scripts/install-runner.sh
#     5. Re-run this workflow.
#
# Security model:
#   • Only the manual trigger (workflow_dispatch) and trusted-main automatic
#     trigger (workflow_run after CI on main) are accepted.
#   • PRs and fork pushes NEVER reach this workflow.
#   • KUBECONFIG_DEV grants the cicd-deployer ServiceAccount access to the
#     triage-dev namespace only (Role: cicd-deployer-role).  The token has
#     no cluster-admin or cross-namespace access.
#   • The kubeconfig is written to a tmpfs path, used, then explicitly deleted.
#   • On rollout failure the workflow runs `kubectl rollout undo` before exit.
#   • GitHub Environment "dev" — add required-reviewers in
#     Settings → Environments → dev for an additional approval gate.
#
# Image naming (from ci.yml):
#   ghcr.io/automation-agent-ai/multilingual-ticket-triage-devops:sha-<40-char-sha>
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy — DEV

on:
  # Automatic: run after CI completes successfully on main.
  workflow_run:
    workflows: ["CI — Test · Build · Scan · Publish"]
    types: [completed]
    branches: [main]

  # Manual: trigger with an explicit GHCR tag for re-deploys or rollbacks.
  workflow_dispatch:
    inputs:
      image_tag:
        description: >
          GHCR image tag to deploy.
          Format: sha-<40-hex-chars>  (immutable, preferred)
          or: latest  (mutable, use with caution)
        required: true
        default: "latest"

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Deploy to triage-dev
    # ── Self-hosted runner requirement ─────────────────────────────────────
    # Label 'triage-dev-deployer' is assigned during runner registration.
    # If no self-hosted runner is registered, the job is queued but will not
    # run (it does NOT fall back to a GitHub-hosted runner).
    runs-on: [self-hosted, linux, triage-dev-deployer]

    # Only proceed when triggered by a successful CI run.
    # workflow_dispatch bypasses this condition (explicit operator intent).
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'

    # GitHub Environment "dev" — add required-reviewers for an extra gate.
    environment: dev

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: automation-agent-ai/multilingual-ticket-triage-devops
      NAMESPACE: triage-dev

    steps:
      # ── Resolve image tag ───────────────────────────────────────────────
      # workflow_run events carry the SHA of the triggering commit.
      # workflow_dispatch inputs carry an explicit tag from the operator.
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="sha-${{ github.event.workflow_run.head_sha }}"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      # ── Validate image tag format ────────────────────────────────────────
      # Enforce sha-<40-hex> for immutable deployments.
      # 'latest' is permitted via workflow_dispatch with a warning.
      - name: Validate image tag
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          if [[ "$TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "✅ Immutable SHA tag confirmed: $TAG"
          elif [ "$TAG" = "latest" ]; then
            echo "::warning::Deploying 'latest' tag — not immutable. Prefer sha-<sha> for traceability."
          else
            echo "::error::Unrecognised tag format: '$TAG'. Use sha-<40-hex-chars> or latest."
            exit 1
          fi

      - name: Resolve full image reference
        id: image
        run: |
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Image: $REF"

      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── kustomize ───────────────────────────────────────────────────────
      # kustomize standalone needed for `kustomize edit set image`.
      # kubectl bundles `kubectl kustomize` (build only) but not `edit`.
      - name: Set up kustomize
        run: |
          if command -v kustomize &>/dev/null; then
            echo "kustomize already available: $(kustomize version)"
          else
            KUSTOMIZE_VERSION="v5.4.3"
            # Install to user-writable directory (runner runs as non-root niwr user)
            mkdir -p "$HOME/.local/bin"
            curl -sL \
              "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
              | tar -xz -C "$HOME/.local/bin/"
            export PATH="$HOME/.local/bin:$PATH"
            kustomize version
          fi
          # Ensure ~/.local/bin is on PATH for all subsequent steps
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ── Patch kustomization (workspace only — NOT committed) ─────────────
      - name: Set registry image reference in kustomization
        run: |
          cd k8s/ci-overlays/dev
          kustomize edit set image \
            "ticket-triage-api=${{ steps.image.outputs.ref }}"
          echo "Updated k8s/ci-overlays/dev/kustomization.yaml:"
          grep -A4 "^images:" kustomization.yaml

      # ── Render manifests (validation) ────────────────────────────────────
      - name: Render CI manifests
        run: |
          echo "========================================================"
          echo "  Final manifests — triage-dev (CI registry deployment)  "
          echo "========================================================"
          kubectl kustomize k8s/ci-overlays/dev

      # ── Write scoped kubeconfig ──────────────────────────────────────────
      # KUBECONFIG_DEV is stored as a GitHub Environment secret.
      # Content: scoped kubeconfig for cicd-deployer ServiceAccount (triage-dev).
      # The file is written to a tmpfs location, used, and deleted in the
      # same step (or the cleanup step below on failure).
      - name: Write scoped kubeconfig
        id: kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DEV }}
        run: |
          KUBECONFIG_FILE="$(mktemp /tmp/kubeconfig-XXXXXX)"
          echo "$KUBECONFIG_DATA" > "$KUBECONFIG_FILE"
          chmod 600 "$KUBECONFIG_FILE"
          echo "path=$KUBECONFIG_FILE" >> "$GITHUB_OUTPUT"
          echo "Kubeconfig written (permissions 600)"

      # ── Apply to DEV cluster ─────────────────────────────────────────────
      - name: Apply to triage-dev cluster
        id: apply
        env:
          KUBECONFIG: ${{ steps.kubeconfig.outputs.path }}
        run: |
          echo "Applying k8s/ci-overlays/dev to namespace: ${{ env.NAMESPACE }}"
          kubectl apply -k k8s/ci-overlays/dev --namespace "${{ env.NAMESPACE }}"

      # ── Rollout verification ─────────────────────────────────────────────
      - name: Wait for rollout to complete
        id: rollout
        env:
          KUBECONFIG: ${{ steps.kubeconfig.outputs.path }}
        run: |
          echo "Waiting for deployment/ticket-triage rollout (timeout: 300s)"
          kubectl rollout status deployment/ticket-triage \
            --namespace "${{ env.NAMESPACE }}" \
            --timeout=300s

      # ── Smoke test — health endpoints ────────────────────────────────────
      - name: Verify readiness via kubectl exec probe
        env:
          KUBECONFIG: ${{ steps.kubeconfig.outputs.path }}
        run: |
          POD=$(kubectl get pod \
            -n "${{ env.NAMESPACE }}" \
            -l app=ticket-triage \
            -o jsonpath='{.items[0].metadata.name}')
          echo "Target pod: $POD"

          echo "--- GET /health ---"
          kubectl exec "$POD" -n "${{ env.NAMESPACE }}" \
            -- curl -sf http://localhost:8000/health

          echo "--- GET /ready ---"
          kubectl exec "$POD" -n "${{ env.NAMESPACE }}" \
            -- curl -sf http://localhost:8000/ready

          echo "--- GET /metrics (first 10 lines) ---"
          kubectl exec "$POD" -n "${{ env.NAMESPACE }}" \
            -- curl -sf http://localhost:8000/metrics | head -10

      # ── Verify image provenance ──────────────────────────────────────────
      - name: Confirm image reference on running pod
        env:
          KUBECONFIG: ${{ steps.kubeconfig.outputs.path }}
        run: |
          ACTUAL=$(kubectl get pod \
            -n "${{ env.NAMESPACE }}" \
            -l app=ticket-triage \
            -o jsonpath='{.items[0].spec.containers[0].image}')
          EXPECTED="${{ steps.image.outputs.ref }}"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Image mismatch — pod is running a different image than deployed."
            exit 1
          fi
          echo "✅ Image provenance confirmed."

      # ── Rollback on failure ──────────────────────────────────────────────
      # Runs only if apply or rollout steps fail.
      - name: Rollback on failure
        if: failure() && steps.apply.outcome == 'success'
        env:
          KUBECONFIG: ${{ steps.kubeconfig.outputs.path }}
        run: |
          echo "::warning::Rollout failed — rolling back deployment/ticket-triage"
          kubectl rollout undo deployment/ticket-triage \
            --namespace "${{ env.NAMESPACE }}"
          kubectl rollout status deployment/ticket-triage \
            --namespace "${{ env.NAMESPACE }}" \
            --timeout=120s
          echo "Rollback complete."

      # ── Kubeconfig cleanup (always) ──────────────────────────────────────
      - name: Delete scoped kubeconfig
        if: always()
        run: |
          if [ -f "${{ steps.kubeconfig.outputs.path }}" ]; then
            rm -f "${{ steps.kubeconfig.outputs.path }}"
            echo "Kubeconfig deleted."
          fi

      # ── Job summary ──────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        env:
          KUBECONFIG: ${{ steps.kubeconfig.outputs.path }}
        run: |
          RESULT="✅ Deployed"
          if [ "${{ steps.rollout.outcome }}" != "success" ]; then
            RESULT="❌ Failed (see rollback)"
          fi
          {
            echo "### DEV Deployment — ${RESULT}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.image.outputs.ref }}\` |"
            echo "| Namespace | \`${{ env.NAMESPACE }}\` |"
            echo "| Kustomize overlay | \`k8s/ci-overlays/dev\` |"
            echo "| Runner | \`${{ runner.name }}\` |"
            echo "| Triggered by | \`${{ github.actor }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Apply outcome | ${{ steps.apply.outcome }} |"
            echo "| Rollout outcome | ${{ steps.rollout.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
