# ──────────────────────────────────────────────────────────────────────────────
# AWS Feature Image Build
#
# Temporary workflow for building and publishing AWS Bedrock migration images
# from the feat/aws-bedrock-migration branch without triggering WSL deployment.
#
# Triggers:
#   push → feat/aws-bedrock-migration   : full pipeline (test + build + scan + push)
#
# Security model:
#   • Runs exclusively on GitHub-hosted runners (never self-hosted)
#   • Default permissions are read-only; jobs explicitly grant extra scope
#   • Trivy exits non-zero on CRITICAL/HIGH findings; push step blocked on failure
#   • Uses GITHUB_TOKEN (packages: write) — no PAT required
#
# Image naming:
#   ghcr.io/automation-agent-ai/multilingual-ticket-triage-devops
#     :aws-sha-<40-char-git-sha>   ← immutable; AWS-specific tag prefix
#
# Isolation:
#   • Workflow name is distinct from "CI — Test · Build · Scan · Publish"
#   • Will NOT trigger workflow_run dependencies in deploy-dev.yml
#   • Does not overwrite :latest or :sha-* production tags
# ──────────────────────────────────────────────────────────────────────────────

name: AWS Feature Image Build

on:
  push:
    branches: [feat/aws-bedrock-migration]

# Minimum default permissions; individual jobs add what they need
permissions:
  contents: read

# Repository-wide environment
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: automation-agent-ai/multilingual-ticket-triage-devops

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1 — Python unit tests
  #
  # Identical to ci.yml test job for consistency
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU-only PyTorch
        run: |
          pip install --upgrade pip
          pip install "torch==2.10.0+cpu" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install project runtime dependencies
        run: |
          pip install -r requirements-docker.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install test-only extras
        run: pip install "pytest==8.3.5" "httpx==0.28.1"

      - name: Run tests (excluding slow model-download tests)
        run: pytest tests/ -m "not slow" -v --tb=short

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2 — Docker build · Trivy scan · GHCR publish
  #
  # AWS-specific tag: aws-sha-<full-commit-sha>
  # ────────────────────────────────────────────────────────────────────────────
  build-scan-push:
    name: Build · Scan · Push (AWS)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write          # push to GHCR
      security-events: write   # upload Trivy SARIF

    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-tag: aws-sha-${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (docker-container driver)
        uses: docker/setup-buildx-action@v3

      # AWS-specific tag prefix: aws-sha-<full-sha>
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=aws-sha-,format=long
          labels: |
            org.opencontainers.image.title=Multilingual Ticket Triage API (AWS Bedrock)
            org.opencontainers.image.description=FastAPI triage service - AWS Bedrock migration
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Pass 1: build + load into local Docker daemon for scanning ──────────
      - name: Build image (local — for Trivy scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ticket-triage-api:aws-ci-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Trivy diagnostic table scan (non-blocking) ───────────────────────────
      - name: Trivy — diagnostic table scan (non-blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ticket-triage-api:aws-ci-scan
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      # ── Trivy vulnerability scan (BLOCKING) ──────────────────────────────────
      - name: Trivy — vulnerability scan
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ticket-triage-api:aws-ci-scan
          format: sarif
          output: trivy-results.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-aws-image-scan

      # ── Pass 2: push to GHCR (conditional on Trivy pass) ────────────────────
      - name: Push image to GHCR
        id: push
        if: steps.trivy.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Write job summary
        if: steps.push.outcome == 'success'
        run: |
          {
            echo "### ✅ AWS Feature Image Published to GHCR"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Registry | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |"
            echo "| Immutable tag | \`aws-sha-${{ github.sha }}\` |"
            echo "| Digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| Branch | \`feat/aws-bedrock-migration\` |"
            echo "| Pushed by | \`${{ github.actor }}\` |"
            echo ""
            echo "**Pull command:**"
            echo "\`\`\`bash"
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:aws-sha-${{ github.sha }}"
            echo "\`\`\`"
            echo ""
            echo "**Next step:** Deploy to AWS DEV namespace using \`k8s/aws-overlays/dev\`"
          } >> "$GITHUB_STEP_SUMMARY"
