# Explicit Amazon Bedrock configuration for the AWS host.
# Select it with CONFIG_PATH=config-aws.yaml (in the image: /app/config-aws.yaml).
# config.yaml stays the local Ollama default.
# Credentials are not stored here. boto3 uses the EC2 instance IAM role.

input_path: data/dataset-tickets-multi-lang3-4k.csv

embedding:
  model_name: intfloat/multilingual-e5-large
  device: auto
  batch_size: 32
  normalize_embeddings: true

vector_store:
  path: data/lancedb
  table_name: ticket_embeddings

retrieval:
  top_k: 5

llm:
  provider: bedrock
  model_name: eu.amazon.nova-micro-v1:0
  region: eu-west-1
  temperature: 0.1
  max_retries: 1
  timeout_seconds: 120
  connect_timeout_seconds: 10
  max_tokens: 1024

batch:
  enabled: true
  split: eval
  limit: 200
  output_csv: outputs/triage_results.csv
  trace_jsonl: outputs/triage_trace.jsonl
  run_summary_json: outputs/run_summary.json
  sample_strategy: balanced_proxy_topic
  random_seed: 42
  stratify_by: proxy_topic
  limit_per_label: 50
  log_decisions: true
  log_reviewer_events: true

thresholds:
  low_confidence: 0.60

reviewer:
  enabled: false
  provider: bedrock
  model_name: eu.amazon.nova-micro-v1:0
  region: eu-west-1
  temperature: 0.1
  max_retries: 1
  timeout_seconds: 120
  max_tokens: 1024
  trigger_flags:
    - low_llm_confidence
    - urgency_disagreement
    - topic_disagreement
  disagreement_confidence_ceiling: 0.85
  urgency_disagreement_confidence_ceiling: 0.90

runtime:
  rebuild_duckdb: false
  rebuild_lancedb: false
  run_smoke_search: false
  run_end_to_end_smoke: false

leaderboard:
  controlled_reviewer_run_ids:
    - run_20260713_014052_ab_off
    - run_20260713_014052_ab_on

  featured_reviewer_run_ids:
    - run_20260711_200952

  analyzer_screening_run_ids:
    - run_20260710_032230
    - run_20260710_025155
    - run_20260710_015910
    - run_20260710_013943

  featured_run_id: run_20260713_014052_ab_on
